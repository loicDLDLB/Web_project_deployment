<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="Level Up">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="760" height="220" rx="32" fill="#0f0b2a"/>
  <!-- icône -->
  <g transform="translate(40,40)">
    <rect width="140" height="140" rx="30" fill="url(#g)"/>
    <g transform="translate(35,35) scale(8.75)">
      <polygon fill="#0f0b2a" opacity="0.35" transform="translate(0.25,0.25)" points="3,0 5,0 5,1 6,1 6,2 7,2 7,3 8,3 8,4 6,4 6,8 2,8 2,4 0,4 0,3 1,3 1,2 2,2 2,1 3,1"/>
      <polygon fill="#ffffff" points="3,0 5,0 5,1 6,1 6,2 7,2 7,3 8,3 8,4 6,4 6,8 2,8 2,4 0,4 0,3 1,3 1,2 2,2 2,1 3,1"/>
    </g>
    <rect x="112" y="14" width="10" height="10" fill="#fff" opacity="0.9"/>
    <rect x="18" y="106" width="8" height="8" fill="#fff" opacity="0.6"/>
  </g>
  <!-- texte -->
  <text x="215" y="108" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="78" letter-spacing="4" fill="#ffffff">LEVEL</text>
  <text x="215" y="178" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="78" letter-spacing="4" fill="url(#t)">UP</text>
  <!-- barre pixel -->
  <g fill="#22d3ee">
    <rect x="345" y="150" width="14" height="14"/>
    <rect x="367" y="150" width="14" height="14" opacity="0.75"/>
    <rect x="389" y="150" width="14" height="14" opacity="0.5"/>
    <rect x="411" y="150" width="14" height="14" opacity="0.3"/>
